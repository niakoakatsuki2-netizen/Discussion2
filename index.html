<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Discussion anonyme</title>
<style>
:root{--bg:#f4f1ff;--card:#ffffff;--me:#a58bff;--text:#2d2a40;--muted:#8a86a3;--radius:22px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
header{padding:14px;text-align:center;font-weight:600;background:var(--card);border-bottom-left-radius:var(--radius);border-bottom-right-radius:var(--radius);box-shadow:0 2px 12px #0001}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.msg{max-width:78%;padding:10px 14px;border-radius:var(--radius);background:var(--card);box-shadow:0 1px 4px #0001;word-wrap:break-word;white-space:pre-wrap;font-size:16px;line-height:1.35}
.msg.mine{align-self:flex-end;background:var(--me);color:#fff}
.meta{font-size:11px;color:var(--muted);margin-top:4px}
.mine .meta{color:#eeeaff}
#emojis{display:none;flex-wrap:wrap;gap:2px;padding:8px 12px;background:var(--card)}
#emojis.open{display:flex}
#emojis span{font-size:24px;cursor:pointer;padding:4px 6px;border-radius:12px}
#emojis span:active{background:var(--bg)}
form{display:flex;gap:8px;padding:12px;background:var(--card);border-top-left-radius:var(--radius);border-top-right-radius:var(--radius);align-items:center;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
input{flex:1;min-width:0;border:none;border-radius:999px;padding:12px 16px;font-size:16px;background:var(--bg);color:var(--text);outline:none}
button{border:none;border-radius:999px;padding:10px 14px;font-size:18px;background:var(--me);color:#fff;cursor:pointer}
#emojiBtn{background:var(--bg);font-size:20px}
</style>
</head>
<body>
<header>Discussion anonyme</header>
<div id="messages"></div>
<div id="emojis"></div>
<form id="form">
  <button type="button" id="emojiBtn" aria-label="Emojis">😊</button>
  <input id="input" placeholder="Écris un message…" autocomplete="off" maxlength="500">
  <button type="submit" aria-label="Envoyer">➤</button>
</form>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAt7HgfxyHatm1pYUstfDDhSI97JjjFeto",
  authDomain: "discussion-78455.firebaseapp.com",
  databaseURL: "https://discussion-78455-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "discussion-78455",
  storageBucket: "discussion-78455.firebasestorage.app",
  messagingSenderId: "806414736416",
  appId: "1:806414736416:web:e3219094e0b78859f5f045"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const messagesRef = db.ref('messages');

const myId = (() => {
  try {
    let id = localStorage.getItem('anonId');
    if (!id) { id = Math.random().toString(36).slice(2, 10); localStorage.setItem('anonId', id); }
    return id;
  } catch (e) { return 'x' + Math.random().toString(36).slice(2, 8); }
})();

const box = document.getElementById('messages');
const input = document.getElementById('input');
const form = document.getElementById('form');
const emojiBtn = document.getElementById('emojiBtn');
const emojiPanel = document.getElementById('emojis');

const COLORS = ['#ffd6e4', '#d4ecff', '#d8ffd0', '#fff0b8', '#e6d6ff', '#ffe0cc'];
function colorFor(id) {
  let h = 0;
  for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return COLORS[h % COLORS.length];
}

messagesRef.limitToLast(200).on('child_added', snap => {
  const m = snap.val();
  if (!m) return;
  const mine = m.a === myId;
  const div = document.createElement('div');
  div.className = 'msg' + (mine ? ' mine' : '');
  if (!mine) div.style.background = colorFor(m.a);
  div.textContent = m.t;
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = m.ts ? new Date(m.ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';
  div.appendChild(meta);
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
});

form.addEventListener('submit', e => {
  e.preventDefault();
  const t = input.value.trim();
  if (!t) return;
  messagesRef.push({ t, a: myId, ts: firebase.database.ServerValue.TIMESTAMP });
  input.value = '';
});

const EMOJIS = ['😀','😂','🥰','😎','🤔','😭','😅','🤣','🙃','👀','👍','👎','🙏','🔥','🎉','🥳','❤️','💀','😴','😡','🤷','👋','✨','🍕'];
EMOJIS.forEach(em => {
  const s = document.createElement('span');
  s.textContent = em;
  s.addEventListener('click', () => {
    const start = input.selectionStart ?? input.value.length;
    input.value = input.value.slice(0, start) + em + input.value.slice(start);
    input.focus();
  });
  emojiPanel.appendChild(s);
});
emojiBtn.addEventListener('click', () => emojiPanel.classList.toggle('open'));
</script>
</body>
</html>
